// 当前文件只保留最小的 Forge 开发、构建和运行配置。
// 正式环境需要 refmap 才能把原版类的 Mixin 目标映射到 SRG 名
buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// 构建时生成 Mixin refmap
apply plugin: 'org.spongepowered.mixin'

def mcpJarDir = file('E:/模组/我的世界mcp的jar')
def mcpJarName = 'minecraft-mcp-1.20.1-forge-v0.4.20'
def selfMcpJarDir = file('E:/模组/自用工具源码+产物/Minecraft Self MCP/Minecraft Self MCP-1.20.1-Forge/build/libs')
def selfMcpJarName = 'self_mcp-1.20.1-forge-0.3.0'

repositories {
    maven {
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    // 本机游戏交互 MCP 所在目录，按模块解析才能被 fg.deobf 反混淆。
    flatDir {
        dirs mcpJarDir
        content {
            includeGroup 'local'
        }
    }
    flatDir {
        dirs selfMcpJarDir
        content {
            includeGroup 'local'
        }
    }
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-${project.minecraft_version}-forge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: project.mapping_channel, version: project.mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // 开发环境加载本模组的 Mixin 配置
            args '-mixin.config=tinkers_kubejs_arsenal.mixins.json'

            mods {
                "${project.mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 把 refmap 写入 JAR，供正式环境 Mixin 使用
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
}

dependencies {
    // Mixin 注解处理器，生成 refmap
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    // 匠魂附属的核心开发依赖。
    implementation fg.deobf("curse.maven:mantle-74924:${project.mantle_curseforge_file_id}")
    implementation fg.deobf("curse.maven:tinkers-construct-74072:${project.tconstruct_curseforge_file_id}")
    // HPTlib 提供材料三围与属性公式的数据包支持，本模组强制依赖。
    implementation "org.hp.hptlib:hptlib:${project.hptlib_version}"
    // KubeJS API 在编译期可见，运行时由测试环境加载。
    compileOnly fg.deobf("curse.maven:kubejs-238086:${project.kubejs_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:kubejs-238086:${project.kubejs_curseforge_file_id}")
    compileOnly fg.deobf("curse.maven:rhino-416294:${project.rhino_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:rhino-416294:${project.rhino_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:architectury-api-419699:${project.architectury_curseforge_file_id}")
    // ProbeJS 仅作可选的补全支持，不写入 mods.toml，发布时不强制依赖。
    compileOnly fg.deobf("curse.maven:probejs-585406:${project.probejs_curseforge_file_id}")
    runtimeOnly fg.deobf("curse.maven:probejs-585406:${project.probejs_curseforge_file_id}")
    // 材料扩展参考依赖，仅用于开发环境兼容性验证。
    runtimeOnly fg.deobf("curse.maven:tinkers-reforged-376876:${project.tinkers_reforged_curseforge_file_id}")
    implementation fg.deobf("curse.maven:jei-238222:8778011")
    implementation fg.deobf("curse.maven:jade-324717:8479276")
    // 本机存在游戏交互 MCP 时加入开发环境，便于自动化测试；其他机器没有该文件时跳过。
    if (!project.hasProperty('skipMcp') && new File(mcpJarDir, mcpJarName + '.jar').exists()) {
        runtimeOnly fg.deobf("local:${mcpJarName}:0.4.20")
    }
    if (new File(selfMcpJarDir, selfMcpJarName + '.jar').exists()) {
        runtimeOnly fg.deobf("local:${selfMcpJarName}:0.3.0")
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            forge_version: project.forge_version,
            forge_version_range: project.forge_version_range,
            loader_version_range: project.loader_version_range,
            hptlib_version_range: project.hptlib_version_range,
            mod_id: project.mod_id,
            mod_name: project.mod_name,
            mod_license: project.mod_license,
            mod_version: project.mod_version,
            mod_authors: project.mod_authors,
            mod_description: project.mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title': project.mod_id,
                'Specification-Vendor': project.mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': project.mod_authors,
                // 发布 jar 通过清单声明 Mixin 配置
                'MixinConfigs': 'tinkers_kubejs_arsenal.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // 保留方法参数名，ProbeJS 补全会显示真实参数名
    options.compilerArgs << '-parameters'
}
