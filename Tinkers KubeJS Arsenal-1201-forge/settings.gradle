pluginManagement {
    repositories {
        // 使用 ForgeGradle 所需的官方插件仓库。
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

rootProject.name = 'tinkers_kubejs_arsenal'

// 关联本地 HPTlib Composite Build，材料三围与属性公式由 HPTlib 提供。
includeBuild('../../HPTlib/HPTlib-1201-forge') {
    dependencySubstitution {
        substitute module('org.hp.hptlib:hptlib') using project(':')
    }
}
